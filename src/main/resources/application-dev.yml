spring:
  application:
    name: materialGrid

  datasource:
    url: jdbc:mysql://localhost:3306/material_grid?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
    username: root
    password: Sheliya@123
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    header: Authorization
    prefix: "Bearer "
  security:
    session-token-header: Authorization
    session-token-prefix: "Bearer "
    session-idle-timeout-minutes: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.example.materialGrid: INFO